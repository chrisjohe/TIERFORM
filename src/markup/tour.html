<div id="tourBlock" aria-hidden="true"></div>
<div id="tourRing" aria-hidden="true"></div>
<div id="tourCard" role="dialog" aria-labelledby="tourTitle">
  <button type="button" class="ghost modal-x" id="tourX" aria-label="End the tour" title="End the tour"><svg class="ic"><use href="#i-close"/></svg></button>
  <h3 id="tourTitle"></h3>
  <p id="tourBody"></p>
  <div class="tour-foot">
    <span id="tourCount"></span>
    <button type="button" class="ghost" id="tourBack">Back</button>
    <button type="button" class="primary" id="tourNext">Next</button>
  </div>
</div>
